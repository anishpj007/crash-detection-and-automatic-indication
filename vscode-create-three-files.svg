<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#f3f6fb"/><text x="60" y="65" font-family="Arial" font-size="32" font-weight="bold" fill="#172033">Create 3 files in VS Code</text>
<rect x="60" y="105" width="1080" height="590" rx="18" fill="#1e1e1e"/><rect x="60" y="105" width="1080" height="44" rx="18" fill="#323233"/><circle cx="87" cy="127" r="7" fill="#ff5f57"/><circle cx="110" cy="127" r="7" fill="#febc2e"/><circle cx="133" cy="127" r="7" fill="#28c840"/><text x="430" y="134" font-family="Arial" font-size="16" fill="#ddd">milk-delivery — Visual Studio Code</text>
<rect x="60" y="149" width="360" height="546" fill="#252526"/><text x="90" y="190" font-family="Arial" font-size="17" fill="#ddd">EXPLORER</text><text x="90" y="230" font-family="Arial" font-size="18" fill="#fff">▾ MILK-DELIVERY</text>
<rect x="342" y="203" width="30" height="30" rx="4" fill="#1375c9"/><text x="349" y="225" font-family="Arial" font-size="24" fill="white">+</text><path d="M357 236 L357 266" stroke="#54a8ed" stroke-width="3"/><text x="385" y="259" font-family="Arial" font-size="16" fill="#54a8ed">1. Click New File (+)</text>
<text x="110" y="310" font-family="Arial" font-size="20" fill="#e6e6e6">index.html</text><text x="385" y="310" font-family="Arial" font-size="16" fill="#54a8ed">2. Type name, press Enter</text>
<text x="110" y="360" font-family="Arial" font-size="20" fill="#e6e6e6">style.css</text><text x="385" y="360" font-family="Arial" font-size="16" fill="#54a8ed">3. Click + again, type name</text>
<text x="110" y="410" font-family="Arial" font-size="20" fill="#e6e6e6">script.js</text><text x="385" y="410" font-family="Arial" font-size="16" fill="#54a8ed">4. Click + again, type name</text>
<rect x="420" y="149" width="720" height="546" fill="#1e1e1e"/><text x="465" y="205" font-family="Arial" font-size="20" fill="#858585">Open each file, paste its matching code, then press Ctrl + S.</text><text x="465" y="265" font-family="Arial" font-size="18" fill="#6a9955">&lt;!-- index.html --&gt;</text><text x="465" y="310" font-family="Arial" font-size="18" fill="#d4d4d4">Webpage structure goes here</text><text x="465" y="390" font-family="Arial" font-size="18" fill="#569cd6">/* style.css */</text><text x="465" y="435" font-family="Arial" font-size="18" fill="#d4d4d4">Colors and layout go here</text><text x="465" y="515" font-family="Arial" font-size="18" fill="#dcdcaa">// script.js</text><text x="465" y="560" font-family="Arial" font-size="18" fill="#d4d4d4">Button actions go here</text>
<text x="70" y="735" font-family="Arial" font-size="17" fill="#354052">Tip: All three files must be inside the same project folder.</text></svg>
